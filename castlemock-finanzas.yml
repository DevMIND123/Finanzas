services:
  castle-mock-finanzas:
    image: castlemock/castlemock
    container_name: castlemock-finanzas
    ports:
      - "8012:8080"
    volumes:
      - ./data/soporte:/root/.castlemock
    networks:
      - devNetworkArq
    restart: unless-stopped

networks:
  devNetworkArq:
    external: true
